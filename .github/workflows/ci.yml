name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # WPF and the test project both target net10.0-windows, so this cannot run on Linux.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore VrcImageCurator.sln

      - name: Verify formatting
        run: dotnet format VrcImageCurator.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build VrcImageCurator.sln -c Release --no-restore

      - name: Test
        run: dotnet test VrcImageCurator.sln -c Release --no-restore --no-build

      - name: Publish portable executable
        run: dotnet publish src\VrcImageCurator.App\VrcImageCurator.App.csproj -p:PublishProfile=Portable

      - uses: actions/upload-artifact@v4
        with:
          name: VrcImageCurator-portable
          path: publish/VrcImageCurator.exe
          if-no-files-found: error
